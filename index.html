<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کابینت سازی چوبی</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Vazirmatn', Tahoma, sans-serif;
  }

  html, body {
    background: #e8dcc8;
    color: #4a2c17;
  }

  /* ===== دو لنگه در چوبی ===== */
  .doors {
    position: fixed;
    inset: 0;
    display: flex;
    direction: ltr;
    z-index: 9999;
  }

  .door {
    width: 50%;
    height: 100vh;
    position: relative;
    transition: transform 1.4s cubic-bezier(0.77, 0, 0.175, 1);
    box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.6);
  }

  .door-left {
    background: linear-gradient(135deg, #6b4423 0%, #4a2c17 50%, #3d2614 100%);
    border-right: 3px solid #2b1a0f;
  }

  .door-right {
    background: linear-gradient(225deg, #6b4423 0%, #4a2c17 50%, #3d2614 100%);
    border-left: 3px solid #2b1a0f;
  }

  .door::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(
      90deg, transparent, transparent 8px,
      rgba(0, 0, 0, 0.08) 8px, rgba(0, 0, 0, 0.08) 10px
    );
    pointer-events: none;
  }

  .door::after {
    content: '';
    position: absolute;
    inset: 30px;
    border: 2px solid rgba(212, 165, 116, 0.25);
    border-radius: 6px;
    box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.4);
    pointer-events: none;
  }

  .handle {
    position: absolute;
    top: 50%;
    width: 14px;
    height: 90px;
    background: linear-gradient(180deg, #d4a574, #8a6a3f, #d4a574);
    border-radius: 8px;
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.6), inset 0 0 5px rgba(255, 255, 255, 0.3);
    transform: translateY(-50%);
  }

  .door-left .handle { right: 25px; }
  .door-right .handle { left: 25px; }

  .doors.open .door-left { transform: translateX(-100%); }
  .doors.open .door-right { transform: translateX(100%); }

  /* ===== دکمه شروع ===== */
  .start-btn {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    z-index: 10000;
    padding: 18px 50px;
    background: #f5ede0;
    border: 2px solid #8a6a3f;
    color: #4a2c17;
    font-size: 18px;
    font-weight: 600;
    font-family: inherit;
    border-radius: 50px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: all 0.5s ease;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
  }

  .start-btn.show {
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, -50%) scale(1);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3), 0 0 0 0 rgba(138, 106, 63, 0.5); }
    50%      { box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3), 0 0 0 15px rgba(138, 106, 63, 0); }
  }

  /* ===== محتوای سایت ===== */
  .content {
    position: relative;
    min-height: 100vh;
    transform: translateY(100vh);
    transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
    background: #e8dcc8;
  }

  .content.show {
    transform: translateY(0);
  }

  .site-header {
    padding: 25px 30px;
    border-bottom: 1px solid #d4c4a8;
    background: #f0e6d2;
  }

  .logo {
    font-size: 22px;
    color: #6b4423;
    font-weight: bold;
  }

  .categories {
    padding: 50px 25px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .categories h2 {
    text-align: center;
    font-size: 28px;
    color: #6b4423;
    margin-bottom: 40px;
    font-weight: bold;
  }

  .cats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
    max-width: 900px;
    margin: 0 auto;
  }

  .cat-card {
    background: #f5ede0;
    border: 2px solid #d4c4a8;
    border-radius: 18px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 4px 12px rgba(107, 68, 35, 0.08);
    -webkit-tap-highlight-color: transparent;
    text-decoration: none;
    display: block;
    color: inherit;
  }

  .cat-card:active {
    transform: scale(0.97);
    border-color: #8a6a3f;
  }

  .cat-card img {
    width: 100%;
    height: 160px;
    object-fit: cover;
    display: block;
    pointer-events: none;
  }

  .cat-card h3 {
    color: #4a2c17;
    font-size: 16px;
    font-weight: 600;
    text-align: center;
    padding: 15px 8px;
    pointer-events: none;
  }

  footer {
    padding: 25px;
    text-align: center;
    background: #f0e6d2;
    color: #8a6a3f;
    font-size: 13px;
  }

  @media (min-width: 768px) {
    .cats-grid { grid-template-columns: repeat(4, 1fr); max-width: 1100px; }
    .cat-card img { height: 200px; }
  }
</style>
</head>
<body>

<div class="doors" id="doors">
  <div class="door door-left"><div class="handle"></div></div>
  <div class="door door-right"><div class="handle"></div></div>
</div>

<button class="start-btn" id="startBtn" onclick="startSite()">مشاهده نمونه کارها</button>

<div class="content" id="content">
  <div class="site-header">
    <div class="logo">چوب و هنر</div>
  </div>

  <div class="categories">
    <h2>دسته‌بندی محصولات</h2>
    <div class="cats-grid">

      <a class="cat-card" href="products.html?cat=m">
        <img src="mo1.webp" alt="مبلمان">
        <h3>مبلمان</h3>
      </a>

      <a class="cat-card" href="products.html?cat=b">
        <img src="bi1.webp" alt="کابینت">
        <h3>کابینت آشپزخانه</h3>
      </a>

      <a class="cat-card" href="products.html?cat=t">
        <img src="ta1.webp" alt="تخت">
        <h3>تخت خواب</h3>
      </a>

      <a class="cat-card" href="products.html?cat=k">
        <img src="ko1.webp" alt="کمد">
        <h3>کمد دیواری</h3>
      </a>

    </div>
  </div>

  <footer>© ۱۴۰۴ چوب و هنر</footer>
</div>

<script>
  window.onload = function() {
    setTimeout(function() {
      document.getElementById('doors').className = 'doors open';
    }, 500);
    setTimeout(function() {
      document.getElementById('startBtn').className = 'start-btn show';
    }, 1900);
  };

  function startSite() {
    document.getElementById('startBtn').className = 'start-btn';
    document.getElementById('content').className = 'content show';
  }
</script>

</body>
</html>
