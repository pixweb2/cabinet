<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نمونه کارها</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Vazirmatn', Tahoma, sans-serif;
  }

  html, body {
    background: #e8dcc8;
    color: #4a2c17;
    min-height: 100vh;
  }

  .page-header {
    padding: 20px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #f0e6d2;
    border-bottom: 1px solid #d4c4a8;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .page-header h2 {
    color: #6b4423;
    font-size: 20px;
    font-weight: bold;
  }

  .back-btn {
    padding: 10px 24px;
    background: transparent;
    border: 2px solid #8a6a3f;
    color: #6b4423;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    border-radius: 50px;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.3s;
    -webkit-tap-highlight-color: transparent;
  }

  .back-btn:active {
    background: #8a6a3f;
    color: #f5ede0;
  }

  .gallery-wrap {
    padding: 20px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  /* ===== آیتم محصول ===== */
  .product-item {
    display: flex;
    flex-direction: column;
    box-shadow: 0 4px 12px rgba(107, 68, 35, 0.08);
    border-radius: 12px;
    overflow: hidden;
    transition: transform 0.3s;
  }

  .product-item:active {
    transform: scale(0.97);
  }

  .product-item img {
    width: 100%;
    height: 170px;
    object-fit: cover;
    display: block;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .product-item .price {
    background: #f0e6d2;
    color: #6b4423;
    font-size: 13px;
    font-weight: 700;
    text-align: center;
    padding: 10px 5px;
    border-top: 1px solid #d4c4a8;
  }

  footer {
    padding: 25px;
    text-align: center;
    background: #f0e6d2;
    color: #8a6a3f;
    font-size: 13px;
    margin-top: 40px;
  }

  /* ===== لایت‌باکس با زوم ===== */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.95);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    overflow: hidden;
    touch-action: none;
  }

  .lightbox.show {
    display: flex;
  }

  .lightbox-img {
    max-width: 95%;
    max-height: 90vh;
    object-fit: contain;
    border-radius: 8px;
    transform-origin: center center;
    will-change: transform;
    user-select: none;
    -webkit-user-drag: none;
  }

  .lightbox-close {
    position: absolute;
    top: 20px;
    left: 20px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.15);
    color: #f5ede0;
    font-size: 22px;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 1001;
    -webkit-tap-highlight-color: transparent;
  }

  .lightbox-hint {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(245, 237, 224, 0.6);
    font-size: 12px;
    z-index: 1001;
    pointer-events: none;
  }

  @media (min-width: 768px) {
    .page-header { padding: 25px 40px; }
    .page-header h2 { font-size: 24px; }
    .back-btn { padding: 12px 30px; font-size: 15px; }
    .gallery-wrap { padding: 30px 40px; }
    .gallery-grid {
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }
    .product-item img { height: 220px; }
    .product-item .price { font-size: 15px; padding: 14px 8px; }
  }

  @media (min-width: 1024px) {
    .gallery-grid { grid-template-columns: repeat(4, 1fr); }
  }
</style>
</head>
<body>

<header class="page-header">
  <h2 id="pageTitle">نمونه کارها</h2>
  <a class="back-btn" href="index.html">بازگشت</a>
</header>

<div class="gallery-wrap">
  <div class="gallery-grid" id="galleryGrid"></div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img class="lightbox-img" id="lightboxImg" src="" alt="">
  <div class="lightbox-hint"> </div>
</div>

<script>
  var data = {
    m: { title: 'مبلمان', images: ['m1','m2','m3','m4','m5','m6'] },
    b: { title: 'کابینت آشپزخانه', images: ['b1','b2','b3','b4','b5','b6'] },
    t: { title: 'تخت خواب', images: ['t1','t2','t3','t4','t5','t6'] },
    k: { title: 'کمد دیواری', images: ['k1','k2','k3','k4','k5','k6'] }
  };

  var catKey = 'm';
  var params = window.location.search;
  if (params.indexOf('cat=') !== -1) {
    catKey = params.split('cat=')[1].split('&')[0];
  }

  var currentCat = data[catKey];

  if (currentCat) {
    document.getElementById('pageTitle').innerHTML = currentCat.title;
    document.title = currentCat.title + ' |  هنر چوب';

    var images = currentCat.images;
    var html = '';

    for (var i = 0; i < images.length; i++) {
      var src = images[i] + '.webp';
      html = html + '<div class="product-item">';
      html = html + '<img src="' + src + '" onclick="openLightbox(\'' + src + '\')">';
      html = html + '<div class="price">۱۰۰,۰۰۰,۰۰۰ تومان</div>';
      html = html + '</div>';
    }

    document.getElementById('galleryGrid').innerHTML = html;
  }

  // ===== لایت‌باکس + زوم =====
  var lightbox = document.getElementById('lightbox');
  var lightboxImg = document.getElementById('lightboxImg');

  var scale = 1, minScale = 1, maxScale = 4;
  var posX = 0, posY = 0;
  var lastDist = 0;
  var lastTapTime = 0;
  var isDragging = false;
  var dragStartX = 0, dragStartY = 0;

  function applyTransform() {
    lightboxImg.style.transform = 'translate(' + posX + 'px,' + posY + 'px) scale(' + scale + ')';
  }

  function resetZoom() {
    scale = 1; posX = 0; posY = 0;
    applyTransform();
  }

  function openLightbox(src) {
    lightboxImg.src = src;
    resetZoom();
    lightbox.className = 'lightbox show';
  }

  function closeLightbox() {
    lightbox.className = 'lightbox';
  }

  lightbox.addEventListener('click', function(e) {
    if (e.target === lightbox) closeLightbox();
  });

  function getDistance(touches) {
    var dx = touches[0].clientX - touches[1].clientX;
    var dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  lightboxImg.addEventListener('touchstart', function(e) {
    if (e.touches.length === 2) {
      lastDist = getDistance(e.touches);
    } else if (e.touches.length === 1) {
      var now = Date.now();
      if (now - lastTapTime < 300) {
        scale = scale > 1 ? 1 : 2.5;
        posX = 0; posY = 0;
        applyTransform();
      }
      lastTapTime = now;

      isDragging = scale > 1;
      dragStartX = e.touches[0].clientX - posX;
      dragStartY = e.touches[0].clientY - posY;
    }
  }, { passive: true });

  lightboxImg.addEventListener('touchmove', function(e) {
    if (e.touches.length === 2) {
      var newDist = getDistance(e.touches);
      if (lastDist > 0) {
        var delta = (newDist - lastDist) * 0.01;
        scale = Math.min(maxScale, Math.max(minScale, scale + delta));
        applyTransform();
      }
      lastDist = newDist;
    } else if (e.touches.length === 1 && isDragging) {
      posX = e.touches[0].clientX - dragStartX;
      posY = e.touches[0].clientY - dragStartY;
      applyTransform();
    }
  }, { passive: true });

  lightboxImg.addEventListener('touchend', function(e) {
    lastDist = 0;
    isDragging = false;
    if (scale <= 1) { posX = 0; posY = 0; applyTransform(); }
  });

  lightboxImg.addEventListener('wheel', function(e) {
    e.preventDefault();
    var delta = -e.deltaY * 0.002;
    scale = Math.min(maxScale, Math.max(minScale, scale + delta));
    if (scale <= 1) { posX = 0; posY = 0; }
    applyTransform();
  }, { passive: false });

  lightboxImg.addEventListener('dblclick', function() {
    scale = scale > 1 ? 1 : 2.5;
    posX = 0; posY = 0;
    applyTransform();
  });

  var mouseDown = false;
  lightboxImg.addEventListener('mousedown', function(e) {
    if (scale <= 1) return;
    mouseDown = true;
    dragStartX = e.clientX - posX;
    dragStartY = e.clientY - posY;
  });
  window.addEventListener('mousemove', function(e) {
    if (!mouseDown) return;
    posX = e.clientX - dragStartX;
    posY = e.clientY - dragStartY;
    applyTransform();
  });
  window.addEventListener('mouseup', function() { mouseDown = false; });
</script>

</body>
</html>
